body{font-family:'Apple SD Gothic Neo',sans-serif;margin:24px auto;max-width:1400px;padding:0 12px;color:#222}

tr.g td{background:#eef4ff;font-weight:700;text-align:left;border-left:1px solid #e3e3e3}
td.kw{text-align:left}
tr.g td{cursor:pointer;user-select:none}
.arr{display:inline-block;width:14px;color:#5a7bd0}
.cnt{float:right;font-weight:400;font-size:11.5px;color:#8a94a6}

.good{color:#0a7a2f;font-weight:700}.mid{color:#c07f00;font-weight:700}.bad{color:#c0392b;font-weight:700}.na{color:#bbb}
td.bid{white-space:nowrap;font-variant-numeric:tabular-nums}
.mb{color:#888;font-size:11px}
.foot{color:#888;font-size:12px}

async function go(){
 const pw=document.getElementById('pw').value;
 try{
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.salt),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.iv)},key,b64(DATA.ct));
  document.getElementById('content').innerHTML=new TextDecoder().decode(pt);
  document.getElementById('gate').style.display='none';
  sessionStorage.setItem('rbpw',pw);
 }catch(e){document.getElementById('err').textContent='비밀번호가 올바르지 않습니다';}
}
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
const gst={},zst={};
function rdr(k){
 const open=(gst[k]??true), z=(zst[k]??false);
 document.querySelectorAll('tr.r.'+k).forEach(tr=>{
  const isZ=tr.classList.contains('z');
  tr.style.display=(open&&(!isZ||z))?'':'none';
 });
 const zt=document.getElementById('zt_'+k);
 if(zt){zt.style.display=open?'':'none';
  zt.firstElementChild.textContent=z?'▾ 노출 없는 키워드 숨기기':('▸ 노출 없는 키워드 '+zt.dataset.n+'개 보기');}
 const a=document.getElementById('arr_'+k); if(a)a.textContent=open?'▾':'▸';
}
function tg(k){gst[k]=!(gst[k]??true);rdr(k);}
function tz(k,ev){if(ev)ev.stopPropagation();zst[k]=!(zst[k]??false);rdr(k);}
function showTab(k){
 for(const x of ['d1','d7']){
  document.getElementById('p-'+x).style.display = (x===k)?'':'none';
  document.getElementById('t-'+x).classList.toggle('on', x===k);
 }
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
const saved=sessionStorage.getItem('rbpw');
if(saved){document.getElementById('pw').value=saved;go();}
</script></body></html>
